name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Устанавливает Gradle 8.9
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    # Принимаем лицензии Android SDK (используем уже установленный на сервере SDK)
    - name: Accept Android SDK Licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    # Распаковывает .zip или вложенные папки, если они есть
    - name: Prepare Project Structure
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            echo "Unzipping $f..."
            unzip -o "$f" || true
          fi
        done
        if [ -d "NeonPlayer-Android" ]; then
          echo "Moving contents from NeonPlayer-Android to root..."
          cp -rn NeonPlayer-Android/* . || true
        fi
        echo "=== Files in workspace ==="
        ls -la

    # Запускаем сборку APK
    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace --no-daemon

    # Выгружаем готовый APK
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NeonPlayer-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
